<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FMP Inn</title>
</head>
<body>

<h2>Edit an existing customer</h2>

<p th:if="${errorMsg}" th:text="${errorMsg}" style="color: red; font-weight: bold;"></p>

<form action="/customer/save" method="post">

    <label for="name">Name:</label><br>
    <input type="text" id="name" name="name" th:value="${customer?.name}"><br><br>

    <label for="email">Email:</label><br>
    <input type="text" id="email" name="email" th:value="${customer?.email}"><br><br>

    <label for="tel">Tel:</label><br>
    <input type="text" id="tel" name="tel" th:value="${customer?.tel}"><br><br>

    <input type="hidden" id="id" name="id" th:value="${customer?.id}">

    <input type="submit" value="Submit">
</form>

</body>
</html>
