services:
  pensionat:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pensionat
    ports:
      - "3308:3306"

  bookingservice:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - pensionat
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://pensionat:3306/pensionat
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update